# fly.toml app configuration file generated for binancemonitor on 2026-07-22T18:22:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'binancemonitor'
primary_region = 'ams'

[build]

[env]
  BMM_DB_PATH = '/data/monitor.sqlite3'
  BMM_HOST = '0.0.0.0'
  BMM_OPEN_BROWSER = 'false'
  BMM_PORT = '8080'

[[mounts]]
  source = 'bmm_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
